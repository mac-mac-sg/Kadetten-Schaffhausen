name: Gewinnscore-Prüfrechnung (einmalig)
on:
  push:
    branches: [ccr-40671898-lkk1z9]
    paths: [scripts/gewinnscore-backtest.mjs, .github/workflows/gewinnscore-backtest.yml]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # www.handball.ch liefert sein Zwischenzertifikat nicht mit; Node bekommt es zusätzlich, die Prüfung bleibt an.
      - run: curl -fsS http://cert.ssl.com/SSL.com-TLS-I-RSA-R1.cer | openssl x509 -inform der -out "$RUNNER_TEMP/sslcom.pem"
      - run: node scripts/gewinnscore-backtest.mjs
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/sslcom.pem
