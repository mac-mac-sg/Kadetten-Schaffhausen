name: Android Widget
on:
  pull_request:
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  push:
    branches: [main]
    paths: ['android-widget/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android-Tests, Lint und installierbare APK
        working-directory: android-widget
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kadetten-Widget-Android
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Pruefberichte
          path: android-widget/app/build/reports/
          retention-days: 14
